name: Jarvis feature-branch checks

on:
  push:
    branches:
      - feature/local-llm-security
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-llm-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest psutil
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          ai/local_llm.py
          main.py
          nlp/intent_parser.py
          execution/dispatcher.py
          security/confirmation_manager.py
          security/authentication.py
          plugins/applications.py
          plugins/desktop_automation.py
          execution/command_registry.py
          execution/plugin_manager.py
      - name: Run local LLM and security tests
        run: python -m pytest -q tests/test_local_llm.py tests/test_security_hardening.py tests/test_plugins.py tests/test_desktop_intent_parsing.py tests/test_settings_store_paths.py
