name: Jarvis feature-branch checks

on:
  push:
    branches:
      - feature/local-llm-security
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-llm-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          ai/local_llm.py
          main.py
          nlp/intent_parser.py
          execution/dispatcher.py
          security/confirmation_manager.py
          security/authentication.py
      - name: Run local LLM and security tests
        run: python -m pytest -q tests/test_local_llm.py tests/test_security_hardening.py
